[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jm-qqbot"
version = "0.1.0"
description = "使用 Docker 部署的 QQ 群 JM 下载、PDF 加密打包与文件上传机器人"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "img2pdf>=0.6,<1",
  "jmcomic==2.7.2",
  "Pillow>=10,<13",
  "pyzipper==0.4.0",
  "python-dotenv>=1.0,<2",
  "qq-botpy==1.2.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[project.scripts]
jm-qqbot = "jm_qqbot.bot:main"

[tool.setuptools.packages.find]
include = ["jm_qqbot*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
